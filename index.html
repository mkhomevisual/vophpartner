<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOPH Partners — FMCG trading & sourcing</title>
    <meta
      name="description"
      content="Váš dlouhodobý partner pro FMCG trading a sourcing. Globální značky, konkurenceschopné ceny, dlouhodobá partnerství."
    />
    <meta name="theme-color" content="#f6f3ee" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- apply stored theme before first paint (light is the default) -->
    <script>
      try {
        if (localStorage.getItem('voph-theme') === 'dark')
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VOPH Partners" />
    <meta property="og:title" content="VOPH Partners — FMCG trading & sourcing" />
    <meta
      property="og:description"
      content="Globální značky. Konkurenceschopné ceny. Dlouhodobá partnerství."
    />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:locale:alternate" content="en_US" />
    <!-- NOTE: prefix with the production domain before launch -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:title" content="VOPH Partners — FMCG trading & sourcing" />
    <meta
      name="twitter:description"
      content="Globální značky. Konkurenceschopné ceny. Dlouhodobá partnerství."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "VOPH Partners",
        "description": "FMCG trading and sourcing partner. Global brands, competitive prices, long-term partnerships.",
        "email": "info@voph.cz",
        "telephone": "+420 775 372 979",
        "knowsAbout": ["FMCG trading", "FMCG sourcing", "FMCG distribution", "wholesale sourcing"]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
